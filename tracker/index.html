<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawa-Lite Admin Panel</title>
    <style>
        body { background-color: #0B0C10; color: #C5C6C7; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1F2833; padding: 30px; border-radius: 12px; border: 1px solid #1E1F29; text-align: center; width: 350px; }
        h1 { color: #66FCF1; margin-bottom: 20px; }
        .count { font-size: 48px; font-weight: bold; color: white; margin: 10px 0; }
        .user-list { list-style: none; padding: 0; margin-top: 20px; text-align: left; }
        .user-item { padding: 8px; border-bottom: 1px solid #1E1F29; color: #66FCF1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Pawa-Lite Online</h1>
        <div class="count" id="count">0</div>
        <p>Benutzer aktiv</p>
        <ul class="user-list" id="user-list"></ul>
    </div>

    <script>
        async function updateStats() {
            try {
                const response = await fetch('/api/heartbeat');
                const data = await response.json();
                document.getElementById('count').innerText = data.online_count;
                
                const list = document.getElementById('user-list');
                list.innerHTML = '';
                data.online_users.forEach(user => {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    li.innerText = user;
                    list.appendChild(li);
                });
            } catch (e) { console.error(e); }
        }
        setInterval(updateStats, 10000); // Alle 10 Sekunden aktualisieren
        updateStats();
    </script>
</body>
</html>
