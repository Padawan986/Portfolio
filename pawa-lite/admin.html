<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Pawa Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #141417;
            --border-color: #232329;
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .admin-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Login Screen */
        .login-card {
            max-width: 450px;
            margin: 80px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .admin-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #8a8a93 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Dashboard Cards */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Forms & Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .admin-input:focus {
            border-color: var(--accent);
        }

        /* Buttons */
        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
            background: #27272a;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-secondary:hover { background: #3f3f46; }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

        /* Tables & Lists */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            color: var(--text-sub);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .code-box {
            font-family: monospace;
            font-size: 1rem;
            font-weight: 600;
            background: var(--bg-color);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-active { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }
        .badge-used { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-count { background: rgba(79, 70, 229, 0.1); color: #818cf8; border: 1px solid rgba(79, 70, 229, 0.2); }
    </style>
</head>
<body>

<div class="admin-wrapper">

    <!-- LOGIN SCREEN -->
    <div class="login-card" id="login-screen">
        <h2 class="admin-title">Admin Login</h2>
        <div class="form-group">
            <label>E-Mail</label>
            <input type="email" id="admin-email" class="admin-input">
        </div>
        <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="admin-pass" class="admin-input">
        </div>
        <button onclick="login()" class="btn-primary" style="width: 100%;">Einloggen</button>
        <div id="login-error" style="color:var(--danger); margin-top:15px; display:none; font-size: 0.9rem;"></div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" style="display: none;" class="admin-wrapper">
        
        <!-- Header Actions -->
        <div class="dashboard-header">
            <h2 class="admin-title" style="margin:0;">Pawa Control Panel</h2>
            <button onclick="logout()" class="btn-secondary">Abmelden</button>
        </div>

        <!-- BEREICH 1: Beta Access Keys (Limits & Usage) -->
        <div class="section-card">
            <div class="section-title">📊 Bereich 1: Beta Access-Keys (Nutzungslimits)</div>
            
            <div class="form-group">
                <label>Neuen Beta-Key anlegen</label>
                <div class="input-row">
                    <input type="text" id="beta-key-input" class="admin-input" placeholder="Key Name (z.B. beta-team)" style="flex: 2;">
                    <input type="number" id="beta-limit-input" class="admin-input" placeholder="Limit" value="1" min="1" style="flex: 1;">
                    <button onclick="addBetaKey()" class="btn-primary">Key Anlegen</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Status</th>
                        <th>Nutzung</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="beta-key-list">
                    <tr><td colspan="4" style="color: var(--text-sub);">Lade Beta-Keys...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- BEREICH 2: HWID License Keys -->
        <div class="section-card">
            <div class="section-title">💻 Bereich 2: HWID Lizenz-Keys (Hardware-Bindung)</div>
            
            <div class="form-group">
                <label>Neuen HWID-Key generieren</label>
                <div class="input-row">
                    <input type="text" id="hwid-key-input" class="admin-input" placeholder="Eigener Key (leer lassen für auto-generated)">
                    <button onclick="addHwidKey()" class="btn-primary">Key Erstellen</button>
                    <button onclick="addRandomHwidKey()" class="btn-secondary">Zufalls-Key</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Status</th>
                        <th>Gebundene HWID</th>
                        <th>Erstellt am</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody id="hwid-key-list">
                    <tr><td colspan="5" style="color: var(--text-sub);">Lade HWID-Keys...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

<script>
    // Supabase Konfiguration
    const SUPABASE_URL = 'https://bduypfymatnkgjlwzzoi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_upzUkUE4lKwZqpd9FUyQng_v264SGfx';

    let supabaseClient = null;

    try {
        if (typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    } catch (e) {
        console.error("Supabase Init Fehler:", e);
    }

    window.onload = async () => {
        if (!supabaseClient) return;
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) showDashboard();
    };

    // AUTH
    async function login() {
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-pass').value;

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            const errDiv = document.getElementById('login-error');
            errDiv.innerText = error.message;
            errDiv.style.display = 'block';
        } else {
            showDashboard();
        }
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        document.getElementById('login-screen').style.display = 'block';
        document.getElementById('dashboard-screen').style.display = 'none';
    }

    function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'flex';
        loadAllData();
    }

    function loadAllData() {
        fetchBetaKeys();
        fetchHwidKeys();
    }

    /* =========================================================
       BEREICH 1: BETA KEYS LOGIC (beta_keys)
       ========================================================= */
    async function fetchBetaKeys() {
        const tbody = document.getElementById('beta-key-list');
        const { data: keys, error } = await supabaseClient
            .from('beta_keys')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            tbody.innerHTML = `<tr><td colspan="4" style="color: var(--danger)">Fehler: ${error.message}</td></tr>`;
            return;
        }

        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-sub)">Keine Beta-Keys vorhanden.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        keys.forEach(k => {
            const max = k.max_uses || 1;
            const used = k.uses || 0;
            const isExhausted = used >= max;

            const badgeClass = isExhausted ? 'badge-used' : 'badge-active';
            const badgeText = isExhausted ? 'Verbraucht' : 'Aktiv';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="code-box">${k.key}</span></td>
                <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                <td><span class="badge badge-count">${used} / ${max} genutzt</span></td>
                <td><button class="btn-danger" onclick="deleteBetaKey('${k.id}')">Löschen</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function addBetaKey() {
        const keyValue = document.getElementById('beta-key-input').value.trim();
        const limitValue = parseInt(document.getElementById('beta-limit-input').value) || 1;

        if (!keyValue) { alert("Bitte Key eingeben!"); return; }

        const { error } = await supabaseClient.from('beta_keys').insert([{
            key: keyValue,
            max_uses: limitValue,
            uses: 0
        }]);

        if (error) alert("Fehler: " + error.message);
        else {
            document.getElementById('beta-key-input').value = '';
            document.getElementById('beta-limit-input').value = '1';
            fetchBetaKeys();
        }
    }

    async function deleteBetaKey(id) {
        if (!confirm("Beta-Key wirklich löschen?")) return;
        await supabaseClient.from('beta_keys').delete().eq('id', id);
        fetchBetaKeys();
    }

    /* =========================================================
       BEREICH 2: HWID KEYS LOGIC (keys)
       ========================================================= */
    async function fetchHwidKeys() {
        const tbody = document.getElementById('hwid-key-list');
        const { data: keys, error } = await supabaseClient
            .from('keys')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            tbody.innerHTML = `<tr><td colspan="5" style="color: var(--danger)">Fehler: ${error.message}</td></tr>`;
            return;
        }

        if (!keys || keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-sub)">Keine HWID-Keys vorhanden.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        keys.forEach(k => {
            const isUsed = !!k.hwid;
            const statusBadge = isUsed 
                ? '<span class="badge badge-used">Gebunden</span>' 
                : '<span class="badge badge-active">Frei</span>';

            const hwidText = k.hwid ? `<span class="code-box" style="font-size:0.8rem">${k.hwid.substring(0, 14)}...</span>` : '-';
            const createdDate = new Date(k.created_at).toLocaleDateString('de-DE', { hour: '2-digit', minute: '2-digit' });

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="code-box">${k.key}</span></td>
                <td>${statusBadge}</td>
                <td>${hwidText}</td>
                <td style="color: var(--text-sub);">${createdDate}</td>
                <td>
                    ${isUsed ? `<button class="btn-secondary" style="padding:4px 8px; font-size:0.8rem; margin-right:5px;" onclick="resetHWID('${k.id}')">HWID Reset</button>` : ''}
                    <button class="btn-danger" onclick="deleteHwidKey('${k.id}')">Löschen</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function addHwidKey() {
        const input = document.getElementById('hwid-key-input');
        let keyStr = input.value.trim();

        if (!keyStr) {
            keyStr = generateRandomCode();
        }

        const { error } = await supabaseClient.from('keys').insert([{ key: keyStr }]);

        if (error) alert("Fehler beim Erstellen: " + error.message);
        else {
            input.value = '';
            fetchHwidKeys();
        }
    }

    function addRandomHwidKey() {
        document.getElementById('hwid-key-input').value = generateRandomCode();
        addHwidKey();
    }

    function generateRandomCode() {
        return 'PAWA-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    async function resetHWID(id) {
        if (!confirm('HWID-Bindung aufheben?')) return;
        const { error } = await supabaseClient.from('keys').update({ hwid: null, used_at: null }).eq('id', id);
        if (error) alert('Fehler: ' + error.message);
        else fetchHwidKeys();
    }

    async function deleteHwidKey(id) {
        if (!confirm('Diesen HWID-Key wirklich löschen?')) return;
        const { error } = await supabaseClient.from('keys').delete().eq('id', id);
        if (error) alert('Fehler: ' + error.message);
        else fetchHwidKeys();
    }
</script>
</body>
</html>
