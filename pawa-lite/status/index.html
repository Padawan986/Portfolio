  <style>
    .st-wrap{max-width:820px}
    .st-overall{display:flex;align-items:center;gap:16px;padding:24px 26px;border:1px solid var(--cell-line);border-radius:16px;background:var(--cell);margin:30px 0 18px}
    .st-overall h2{all:unset;font:600 22px var(--sans);letter-spacing:-.02em;color:#f4f0ff}
    .st-dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 16px var(--c)}
    .ok{--c:#34d399}.warn{--c:#fbbf24}.bad{--c:#f87171}.info{--c:#60a5fa}.mute{--c:#8d84a8}
    .st-notice{padding:16px 20px;border:1px solid #fbbf2455;background:#fbbf2410;border-radius:12px;color:#fde68a;margin-bottom:18px;font-size:14px;line-height:1.6}
    .st-list{border:1px solid var(--cell-line);border-radius:16px;overflow:hidden;background:var(--cell)}
    .st-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--cell-line)}
    .st-row:last-child{border-bottom:0}
    .st-name{color:#efeaff;font-size:16px}
    .st-note{display:block;color:#8d84a8;font-size:13px;margin-top:4px}
    .st-badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--c);white-space:nowrap}
    .st-badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
    .st-h{font:600 22px var(--sans);color:#efeaff;margin:50px 0 16px;letter-spacing:-.02em}
    .st-inc{padding:20px 24px;border:1px solid var(--cell-line);border-radius:14px;background:var(--cell);margin-bottom:12px}
    .st-inc b{display:block;color:#efeaff;font-size:16px;margin:6px 0}
    .st-inc small{color:#6f6785;font-size:12px}
    .st-inc p{color:#a79fbd;font-size:14px;line-height:1.65}
    .st-empty{color:#8d84a8;font-size:14px}
    .st-meta{margin-top:36px;color:#6f6785;font-size:12px}
  </style>
</head>

<main id="main">

</footer>

<script>
(() => {
  const LEVEL = {
    online:   ["Online", "ok", 0],
    updating: ["Updating", "info", 1],
    down:     ["Down", "bad", 2]
  };
  const UNKNOWN = ["Unknown", "mute", 1];
  const HEADLINE = ["All systems online", "Some systems are updating", "Some systems are down"];
  const STATE = { investigating: "warn", identified: "warn", monitoring: "info", resolved: "ok" };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  function render(s) {
    const services = Array.isArray(s.services) ? s.services : [];
    const worst = services.reduce((m, x) => Math.max(m, (LEVEL[x.status] || UNKNOWN)[2]), 0);
    const top = Object.values(LEVEL).find(l => l[2] === worst) || LEVEL.updating;

    document.getElementById("overall").replaceChildren(el("span", "st-dot " + top[1]), el("h2", "", HEADLINE[worst]));

    const notice = document.getElementById("notice");
    notice.replaceChildren();
    if (s.notice) notice.append(el("div", "st-notice", s.notice));

    const list = document.getElementById("services");
    list.replaceChildren();
    services.forEach(x => {
      const l = LEVEL[x.status] || UNKNOWN;
      const left = el("div");
      left.append(el("span", "st-name", x.name));
      if (x.note) left.append(el("span", "st-note", x.note));
      const row = el("div", "st-row");
      row.append(left, el("span", "st-badge " + l[1], l[0]));
      list.append(row);
    });

    const inc = document.getElementById("incidents");
    inc.replaceChildren();
    const incidents = Array.isArray(s.incidents) ? s.incidents : [];
    if (!incidents.length) inc.append(el("p", "st-empty", "No incidents reported."));
    incidents.forEach(i => {
      const box = el("div", "st-inc");
      const state = i.state || "investigating";
      box.append(el("small", "", i.date || ""));
      box.append(el("b", "", i.title || ""));
      box.append(el("span", "st-badge " + (STATE[state] || "mute"), state.charAt(0).toUpperCase() + state.slice(1)));
      if (i.text) box.append(el("p", "", i.text));
      inc.append(box);
    });

    const d = s.updated ? new Date(s.updated) : null;
    document.getElementById("meta").textContent = d && !isNaN(d) ? "Last updated: " + d.toLocaleString() : "";
  }

  const tag = document.createElement("script");
  tag.src = "/pawa-lite/status/data.js?t=" + Math.floor(Date.now() / 60000);
  tag.onload = () => render(window.PAWA_STATUS || {});
  tag.onerror = () => {
    document.getElementById("overall").replaceChildren(el("span", "st-dot mute"), el("h2", "", "Status currently unavailable"));
  };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
